[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "raggy"
version = "1.0.0"
description = "Raggy: Next-Generation Modular RAG & Agent Framework with Hybrid RRF Retrieval and Smart Chunking"
readme = "README.md"
requires-python = ">=3.9,<4.0"
license = "MIT"
authors = [
    { name = "Raggy Community" }
]
keywords = [
    "RAG",
    "retrieval",
    "LLM",
    "agents",
    "search",
    "hybrid-search",
    "bm25",
    "vector-search",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "llama-index-core>=0.14.25",
]

[project.optional-dependencies]
all = [
    "openai>=3.39.0",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "pydantic>=2.14.1",
]

[project.scripts]
raggy = "raggy.cli:main"

[project.urls]
Homepage = "https://github.com/Mokshith01206/RAGGY"
Repository = "https://github.com/Mokshith01206/RAGGY"
Documentation = "https://github.com/Mokshith01206/RAGGY#readme"

[tool.hatch.build.targets.wheel]
packages = ["raggy"]
